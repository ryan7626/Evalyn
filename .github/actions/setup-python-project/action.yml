name: Setup Evalyn Python project
description: Install a supported Python version and Evalyn development dependencies

inputs:
  python-version:
    description: Python version passed to actions/setup-python
    required: false
    default: "3.12"
  install-target:
    description: Editable pip install target
    required: false
    default: ".[dev]"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install development dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e "${{ inputs.install-target }}"

